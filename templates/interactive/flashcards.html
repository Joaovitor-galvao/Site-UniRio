{% extends 'base.html' %}
{% block title %}Flashcards - {{ site_name }}{% endblock %}

{% block extra_head %}
<style>
.flashcards-container { max-width: 600px; margin: 0 auto; }
.flashcard { perspective: 1000px; margin-bottom: 1.5rem; }
.flashcard-inner { position: relative; width: 100%; height: 300px; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
.flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; border-radius: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.flashcard-front { background: linear-gradient(135deg, var(--cor-principal), var(--cor-secundaria)); color: var(--texto-claro); }
.flashcard-back { background: var(--fundo-secundario); color: var(--texto); transform: rotateY(180deg); }
.flashcard-category { font-size: 0.85rem; opacity: 0.8; margin-bottom: 1rem; }
.flashcard-text { font-size: 1.25rem; line-height: 1.5; }
.flashcard-hint { position: absolute; bottom: 1rem; font-size: 0.75rem; opacity: 0.7; }
.flashcard-controls { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; }
.flashcard-nav { display: flex; justify-content: space-between; margin-top: 1rem; }
.flashcard-counter { text-align: center; margin-top: 1rem; color: #666; }
</style>
{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h1 class="section__title">Flashcards</h1>
        <p class="section__lead">Estude conceitos políticos de forma divertida</p>
        
        <div class="flashcards-container" id="flashcards-app">
            <div class="flashcard-counter">
                Card <span id="current-card">1</span> de <span id="total-cards">0</span>
            </div>
            
            <div class="flashcard" id="flashcard">
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <div class="flashcard-category" id="card-category"></div>
                        <div class="flashcard-text" id="card-front"></div>
                        <div class="flashcard-hint">Clique para virar</div>
                    </div>
                    <div class="flashcard-back">
                        <div class="flashcard-category" id="card-back-category"></div>
                        <div class="flashcard-text" id="card-back"></div>
                    </div>
                </div>
                
                <div class="flashcard-controls">
                    <button class="btn btn--outline" id="btn-prev">Anterior</button>
                    <button class="btn btn--primary" id="btn-flip">Virar</button>
                    <button class="btn btn--outline" id="btn-next">Próximo</button>
                </div>
                
                <div class="flashcard-nav">
                    <button class="btn btn--outline" id="btn-shuffle">Embaralhar</button>
                    <span id="card-counter">1 / 0</span>
                    <button class="btn btn--outline" id="btn-filter">Filtrar Categoria</button>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
const flashcardsData = [
    {front: 'O que é voto consciente?', back: 'Voto baseado em informação, pesquisa e reflexão, não em impulso ou emoção momentânea.', category: 'Conceitos'},
    {front: 'Qual a idade mínima para votar no Brasil?', back: '16 anos (facultativo dos 16 aos 17 e acima de 70; obrigatório dos 18 aos 70).', category: 'Direitos Políticos'},
    {front: 'O que é coligação partidária?', back: 'União de partidos para disputar eleições proporcionais (vereador, deputado), somando votos para distribuir vagas.', category: 'Processo Eleitoral'},
    {front: 'O que é voto em trânsito?', back: 'Permite votar em outra cidade se estiver fora do domicílio eleitoral, apenas para Presidente.', category: 'Processo Eleitoral'},
    {front: 'O que é voto em branco?', back: 'Quando o eleitor não escolhe nenhum candidato. Não é contabilizado para nenhum candidato.', category: 'Conceitos'},
    {front: 'O que é voto nulo?', back: 'Quando o eleitor digita número inexistente. Também não é contabilizado para candidatos.', category: 'Conceitos'},
    {front: 'O que é cláusula de barreira?', back: 'Regra que exige desempenho mínimo nas eleições para partidos terem direito a tempo de TV e fundo partidário.', category: 'Legislação'},
    {front: 'Quem pode ser candidato?', back: 'Brasileiro nato, alfabetizado, filiado a partido, idade mínima (21 para deputado, 30 para senador/governador, 35 para presidente).', category: 'Legislação'},
];

let currentIndex = 0;
let isFlipped = false;

function initFlashcards() {
    updateCard();
    document.getElementById('btn-flip').addEventListener('click', flipCard);
    document.getElementById('btn-prev').addEventListener('click', prevCard);
    document.getElementById('btn-next').addEventListener('click', nextCard);
    document.getElementById('btn-shuffle').addEventListener('click', shuffleCards);
    document.getElementById('btn-filter').addEventListener('click', filterCategory);
    document.getElementById('flashcard').addEventListener('click', flipCard);
}

function updateCard() {
    const card = flashcardsData[currentIndex];
    document.getElementById('card-front').textContent = card.front;
    document.getElementById('card-back').textContent = card.back;
    document.getElementById('card-category').textContent = card.category;
    document.getElementById('card-back-category').textContent = card.category;
    document.getElementById('card-counter').textContent = (currentIndex + 1) + ' / ' + flashcardsData.length;
    
    // Reset flip
    document.getElementById('flashcard').classList.remove('flipped');
    isFlipped = false;
}

function flipCard() {
    document.getElementById('flashcard').classList.toggle('flipped');
    isFlipped = !isFlipped;
}

function prevCard() {
    currentIndex = (currentIndex - 1 + flashcardsData.length) % flashcardsData.length;
    isFlipped = false;
    updateCard();
}

function nextCard() {
    currentIndex = (currentIndex + 1) % flashcardsData.length;
    isFlipped = false;
    updateCard();
}

function shuffleCards() {
    for (let i = flashcardsData.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashcardsData[i], flashcardsData[j]] = [flashcardsData[j], flashcardsData[i]];
    }
    currentIndex = 0;
    isFlipped = false;
    updateCard();
}

function filterCategory() {
    // TODO: Implement category filter
    alert('Filtro por categoria em desenvolvimento');
}

document.addEventListener('DOMContentLoaded', initFlashcards);
</script>
{% endblock %}
