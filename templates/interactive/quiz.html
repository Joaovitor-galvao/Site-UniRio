{% extends 'base.html' %}
{% block title %}Quiz Eleitoral - {{ site_name }}{% endblock %}

{% block extra_head %}
<style>
.quiz-container { max-width: 800px; margin: 0 auto; }
.quiz-question { background: var(--fundo-secundario); padding: 2rem; border-radius: 1rem; margin-bottom: 1.5rem; }
.quiz-options { display: grid; gap: 0.8rem; margin-top: 1.5rem; }
.quiz-option { padding: 1rem; border: 2px solid var(--borda); border-radius: 0.8rem; cursor: pointer; transition: all 0.2s; }
.quiz-option:hover { border-color: var(--cor-destaque); }
.quiz-option.selected { border-color: var(--cor-destaque); background: #fff8f0; }
.quiz-option.correct { border-color: #27ae60; background: #e8f8f0; }
.quiz-option.incorrect { border-color: #e74c3c; background: #fdf2f2; }
.quiz-explanation { margin-top: 1rem; padding: 1rem; background: #f0f8ff; border-radius: 0.8rem; }
.quiz-progress { text-align: right; margin-bottom: 1rem; color: #666; }
.quiz-results { text-align: center; padding: 2rem; }
</style>
{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h1 class="section__title">Quiz Eleitoral</h1>
        <p class="section__lead">Teste seus conhecimentos sobre o processo eleitoral brasileiro</p>
        
        <div class="quiz-container" id="quiz-app">
            <div class="quiz-progress">
                Pergunta <span id="current-q">1</span> de <span id="total-q">0</span>
            </div>
            <div id="quiz-questions"></div>
            <div id="quiz-results" class="quiz-results" style="display:none;"></div>
            <button id="next-btn" class="btn btn--primary" style="display:none;">Próxima</button>
            <button id="restart-btn" class="btn btn--outline" style="display:none;">Refazer Quiz</button>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
// Fetch questions from API and run quiz logic
async function loadQuiz() {
    const res = await fetch('/interativo/api/quiz/');
    const data = await res.json();
    const questions = data.questions || [];
    
    document.getElementById('total-q').textContent = questions.length;
    const container = document.getElementById('quiz-questions');
    
    questions.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'quiz-question';
        div.dataset.index = i;
        div.style.display = i === 0 ? 'block' : 'none';
        div.innerHTML = `
            <h3>Pergunta ${i+1}</h3>
            <p>${q.question}</p>
            <div class="quiz-options">
                ${q.options.map((opt, oi) => `
                    <button class="quiz-option" data-index="${oi}" data-correct="${opt.correct}">
                        ${opt.text}
                    </button>
                `).join('')}
            </div>
            <div class="quiz-explanation" style="display:none;">${q.explanation || ''}</div>
        `;
        container.appendChild(div);
    });
    
    // Event listeners para opções
    container.addEventListener('click', e => {
        if (!e.target.matches('.quiz-option')) return;
        const questionDiv = e.target.closest('.quiz-question');
        const options = questionDiv.querySelectorAll('.quiz-option');
        const explanation = questionDiv.querySelector('.quiz-explanation');
        const isCorrect = e.target.dataset.correct === 'true';
        
        options.forEach(opt => {
            opt.disabled = true;
            if (opt.dataset.correct === 'true') opt.classList.add('correct');
            if (opt === e.target && !isCorrect) opt.classList.add('incorrect');
        });
        
        if (explanation.textContent) explanation.style.display = 'block';
        
        // Mostra botão próximo
        document.getElementById('next-btn').style.display = 'inline-block';
    });
    
    // Próxima pergunta
    let current = 0;
    document.getElementById('next-btn').addEventListener('click', () => {
        const questionsDivs = container.querySelectorAll('.quiz-question');
        questionsDivs[current].style.display = 'none';
        current++;
        if (current < questionsDivs.length) {
            questionsDivs[current].style.display = 'block';
            document.getElementById('current-q').textContent = current + 1;
            document.getElementById('next-btn').style.display = 'none';
        } else {
            showResults(questionsDivs);
        }
    });
    
    function showResults(questionsDivs) {
        const correct = [...questionsDivs].filter(q => 
            q.querySelector('.quiz-option.correct')?.classList.contains('correct') &&
            q.querySelector('.quiz-option.selected')?.classList.contains('correct')
        ).length;
        
        document.getElementById('quiz-questions').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('quiz-progress').style.display = 'none';
        
        const results = document.getElementById('quiz-results');
        results.style.display = 'block';
        results.innerHTML = `
            <h2>Resultado</h2>
            <p class="score">${correct} de ${questionsDivs.length} corretas</p>
            <p>${correct === questionsDivs.length ? 'Parabéns! Você sabe tudo!' : 'Continue estudando!'}</p>
        `;
        document.getElementById('restart-btn').style.display = 'inline-block';
    }
    
    document.getElementById('restart-btn').addEventListener('click', () => location.reload());
    
    loadQuiz();
</script>
{% endblock %}
