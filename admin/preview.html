<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview — CON(S)CIÊNCIA POLÍTICA</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #faf5e8; padding: 2rem; }
        .preview-container { max-width: 1200px; margin: 0 auto; }
        .preview-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
        }
        .preview-header h1 { font-family: 'Playfair Display', Georgia, serif; color: #612a2a; }
        .btn-preview {
            background: #cf6357; color: #faf5e8; border: none;
            padding: 0.5rem 1.5rem; border-radius: 2rem; font-weight: 600;
            cursor: pointer; text-decoration: none; display: inline-block;
        }
        .btn-preview:hover { background: #74402d; }
        .btn-preview-back { background: #2c1e1f; }
        .btn-preview-back:hover { background: #1a1a1a; }
        .live-indicator {
            display: inline-block; width: 12px; height: 12px;
            border-radius: 50%; background: #27ae60;
            animation: pulse 1.5s infinite; margin-right: 0.5rem;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        #preview-content {
            background: #ffffff; border-radius: 1rem; padding: 2rem;
            min-height: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        #preview-content .hero-preview {
            background: #612a2a; color: #faf5e8;
            padding: 2rem; border-radius: 1rem; text-align: center;
        }
        #preview-content .hero-preview h1 { color: #faf5e8; }
        #preview-content .hero-preview .btn {
            background: #cf6357; color: #faf5e8;
            padding: 0.5rem 1.5rem; border-radius: 2rem;
            display: inline-block; text-decoration: none;
        }
        #preview-content .card-preview {
            background: #faf5e8; padding: 1rem; border-radius: 0.8rem;
            border-left: 4px solid #cf6357; margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="preview-header">
            <h1><span class="live-indicator"></span>👁️ Visualização ao Vivo</h1>
            <div class="actions">
                <a href="index.html" class="btn-preview btn-preview-back">← Voltar ao Painel</a>
                <a href="../index.html" target="_blank" class="btn-preview">🌐 Ver Site</a>
            </div>
        </div>
        <div id="preview-content">
            <p style="text-align:center;color:#999;">Carregando preview...</p>
        </div>
    </div>
    <script>
        function updatePreview() {
            const preview = document.getElementById('preview-content');
            const saved = JSON.parse(localStorage.getItem('votoConscienteContent') || '{}');
            
            const heroText = saved.hero ? saved.hero.split('\n') : ['VOTO CONSCIENTE:<br />SAIBA COMO ESCOLHER', 'Três votos...'];
            const apresentacao = saved.apresentacao || 'Texto de apresentação...';
            const objetivos = saved.objetivos ? saved.objetivos.split('\n').filter(l => l.trim()) : [];
            const equipe = saved.equipe ? saved.equipe.split('\n').filter(l => l.trim()) : [];
            const eventos = saved.eventos ? saved.eventos.split('\n').filter(l => l.trim()) : [];

            preview.innerHTML = `
                <div class="hero-preview">
                    <h1>${heroText[0] || 'VOTO CONSCIENTE'}</h1>
                    <p style="font-size:1.1rem;margin:0.5rem 0;">${heroText.slice(1).join('<br>') || 'Aprenda a escolher bem.'}</p>
                    <a href="#" class="btn">Saiba Mais</a>
                </div>
                <div style="margin-top:1rem;">
                    <h2 style="font-size:1.2rem;">Apresentação</h2>
                    <p>${apresentacao}</p>
                </div>
                ${objetivos.length ? `<div style="margin-top:1rem;"><h3>Objetivos</h3><ul>${objetivos.map(o => `<li>${o}</li>`).join('')}</ul></div>` : ''}
                ${equipe.length ? `<div style="margin-top:1rem;"><h3>Equipe</h3>${equipe.map(m => {
                    const p = m.split('-').map(s => s.trim());
                    return `<div class="card-preview"><strong>${p[0] || 'Membro'}</strong><br><span style="color:#666;">${p[1] || 'Cargo'}</span></div>`;
                }).join('')}</div>` : ''}
                ${eventos.length ? `<div style="margin-top:1rem;"><h3>Eventos</h3>${eventos.map(e => {
                    const p = e.split('-').map(s => s.trim());
                    return `<div class="card-preview"><strong>${p[0] || 'Evento'}</strong><br><span style="color:#666;">${p[1] || 'Data'} • ${p[2] || 'Local'}</span></div>`;
                }).join('')}</div>` : ''}
            `;
        }

        document.addEventListener('DOMContentLoaded', updatePreview);
        setInterval(updatePreview, 5000);
    </script>
</body>
</html>
