<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Painel Admin | CON(S)CIÊNCIA POLÍTICA</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" href="../../imagens/logo.png">
    <style>
        body {
            background: linear-gradient(135deg, #2c1e1f 0%, #612a2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            padding: 1rem;
        }
        .login-card {
            background: #faf5e8;
            padding: 3rem 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .login-card .icon { font-size: 4rem; display: block; }
        .login-card h1 {
            font-family: 'Playfair Display', Georgia, serif;
            color: #612a2a;
            font-size: 1.8rem;
            margin: 0.5rem 0 0.3rem;
        }
        .login-card p { color: #888; margin-bottom: 2rem; font-size: 0.95rem; }
        .login-card input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            margin-bottom: 1rem;
            border: 2px solid #e0d6c8;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            background: #fff;
        }
        .login-card input:focus {
            outline: none;
            border-color: #cf6357;
            box-shadow: 0 0 0 4px rgba(207, 99, 87, 0.15);
        }
        .login-card button {
            width: 100%;
            padding: 0.9rem;
            background: #cf6357;
            color: #faf5e8;
            border: none;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            font-family: inherit;
        }
        .login-card button:hover { background: #74402d; }
        .login-card .error {
            background: #fdedec;
            color: #c0392b;
            padding: 0.8rem;
            border-radius: 0.6rem;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }
        .login-card .error.show { display: block; }
        .login-card .dica {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #999;
        }
        .login-card .voltar {
            display: inline-block;
            margin-top: 1.5rem;
            color: #612a2a;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .login-card .voltar:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <span class="icon">🔐</span>
        <h1>Painel Administrativo</h1>
        <p>CON(S)CIÊNCIA POLÍTICA — UNIRIO</p>

        <div class="error" id="error-msg">
            ❌ Usuário ou senha incorretos
        </div>

        <form onsubmit="fazerLogin(event)">
            <input type="text" id="username" placeholder="Usuário" required autocomplete="username" autofocus>
            <input type="password" id="password" placeholder="Senha" required autocomplete="current-password">
            <button type="submit">Entrar</button>
        </form>

        <p class="dica">Usuário: <strong>admin</strong> • Senha: <strong>unirio2026</strong></p>

        <a href="../../index.html" class="voltar">← Voltar ao site</a>
    </div>

    <script>
        const CREDENCIAIS = {
            username: 'admin',
            password: 'unirio2026'
        };

        document.addEventListener('DOMContentLoaded', function() {
            const session = localStorage.getItem('votoConscienteSession');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    if (data.username === 'admin') {
                        window.location.href = '../../admin-panel.html';
                    }
                } catch(e) {
                    localStorage.removeItem('votoConscienteSession');
                }
            }
        });

        function fazerLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            if (username === CREDENCIAIS.username && password === CREDENCIAIS.password) {
                localStorage.setItem('votoConscienteSession', JSON.stringify({
                    username: username,
                    loginTime: new Date().toISOString()
                }));
                window.location.href = '../../admin-panel.html';
            } else {
                errorMsg.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }
    </script>
</body>
</html>
