<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — CON(S)CIÊNCIA POLÍTICA</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23cf6357' rx='20'/><text x='50' y='68' text-anchor='middle' font-family='Georgia' font-weight='900' font-size='50' fill='%23faf5e8'>CP</text></svg>" />
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">🔒</div>
                <h1>CON(S)CIÊNCIA POLÍTICA</h1>
                <p>Painel Administrativo Seguro</p>
            </div>
            <div id="error-message" class="error-message">❌ Usuário ou senha inválidos!</div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" placeholder="Digite seu usuário" required autofocus />
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required />
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            <div class="login-footer">
                <a href="../index.html">← Voltar para o site</a>
            </div>
        </div>
    </div>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('error-message');
            
            if (username === 'admin' && password === 'unirio2026') {
                localStorage.setItem('votoConscienteSession', JSON.stringify({ 
                    username: 'admin', 
                    name: 'Administrador UNIRIO',
                    loginTime: Date.now(),
                    expires: Date.now() + (30 * 60 * 1000)
                }));
                window.location.href = 'index.html';
            } else {
                error.classList.add('show');
                setTimeout(() => error.classList.remove('show'), 3000);
            }
        }
    </script>
</body>
</html>
