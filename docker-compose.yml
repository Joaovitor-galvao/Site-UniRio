version: '3.8'

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:15-alpine
    container_name: conciencia_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conciencia_politica}
      POSTGRES_USER: ${POSTGRES_USER:-django}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django} -d ${POSTGRES_DB:-conciencia_politica}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conciencia_network

  # ===========================================
  # Django Application
  # ===========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conciencia_web
    command: gunicorn conciencia_politica.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=conciencia_politica.settings.production
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-django}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-conciencia_politica}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - conciencia_network
    restart: unless-stopped

  # ===========================================
  # Nginx Reverse Proxy (SSL termination)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: conciencia_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - staticfiles:/app/staticfiles:ro
      - mediafiles:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - conciencia_network
    restart: unless-stopped

  # ===========================================
  # Certbot (Let's Encrypt SSL)
  # ===========================================
  certbot:
    image: certbot/certbot
    container_name: conciencia_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - conciencia_network

volumes:
  postgres_data:
  staticfiles:
  mediafiles:
  certbot_www:
  certbot_conf:

networks:
  conciencia_network:
    driver: bridge